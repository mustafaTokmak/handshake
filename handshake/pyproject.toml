[project]
name = "handshake-demo"
version = "0.1.0"
description = "Reconcile an uncertain shipment outcome before retrying."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "pydantic-ai-slim[openai]>=2.44,<3", "logfire>=4,<6", "python-dotenv>=1,<2"]

[project.optional-dependencies]
modal = ["modal>=1,<2"]

[project.scripts]
handshake = "handshake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handshake"]
